<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A modern GitHub profile and portfolio page rendered from live GitHub data."
    />
    <title>GitHub Profile</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230969da'/%3E%3Ctext x='16' y='22' font-family='Arial, sans-serif' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3Egh%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://api.github.com" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Home">
          <span class="brand-mark">gh</span>
          <span class="brand-text">profile</span>
        </a>
        <form id="search-form" class="search" role="search">
          <input
            id="username-input"
            class="search-input"
            type="text"
            name="username"
            placeholder="Enter a GitHub username…"
            autocomplete="off"
            aria-label="GitHub username"
          />
          <button class="search-button" type="submit">View</button>
        </form>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">
          <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
        </button>
      </header>

      <main id="content" class="content" aria-live="polite">
        <!-- Profile is rendered here -->
      </main>

      <footer class="footer">
        <span>Built with Vite · Data from the GitHub REST API</span>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
